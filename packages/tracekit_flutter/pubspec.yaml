name: tracekit_flutter
description: >-
  Flutter extensions for TraceKit — in-app log viewer, error handlers,
  route observer, and debug overlay.
version: 0.2.0
homepage: https://github.com/vishalsharma7nov/tracekit
repository: https://github.com/vishalsharma7nov/tracekit/tree/master/packages/tracekit_flutter
issue_tracker: https://github.com/vishalsharma7nov/tracekit/issues

environment:
  sdk: ^3.5.0
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  share_plus: ^10.1.4
  tracekit: ^0.1.0

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

topics:
  - logging
  - debugging
  - flutter
