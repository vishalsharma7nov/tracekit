name: tracekit
description: >-
  Structured logging for Dart and Flutter. Replaces print(), log(), and
  debugPrint() with levels, sinks, call-site capture, and redaction.
version: 0.1.0
homepage: https://github.com/tracekit/tracekit
repository: https://github.com/tracekit/tracekit/tree/main/packages/tracekit
issue_tracker: https://github.com/tracekit/tracekit/issues
documentation: https://pub.dev/documentation/tracekit/latest/

environment:
  sdk: ^3.5.0

dependencies:
  meta: ^1.15.0
  stack_trace: ^1.12.0

dev_dependencies:
  lints: ^5.1.0
  test: ^1.25.0

topics:
  - logging
  - debugging
  - observability

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:
